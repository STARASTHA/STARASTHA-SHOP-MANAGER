<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!DOCTYPE html>
<html>
<head>
<title>STARASTHA MANAGER</title>
<link rel="stylesheet" href="style.css">
</head>

<style>
body{
font-family:Arial;
background:#f2f2f2;
margin:0;
}

header{
background:#2196F3;
color:white;
padding:15px;
text-align:center;
}

.container{
width:90%;
margin:auto;
}

.card{
background:white;
padding:20px;
margin:20px 0;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,select,textarea{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#2196F3;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0b7dda;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th,table td{
border:1px solid #ddd;
padding:10px;
text-align:left;
}

th{
background:#0dac0d;
color:white;
}

.summary{
display:flex;
gap:20px;
}

.box{
flex:1;
background:#15aca4;
color:white;
padding:20px;
border-radius:10px;
text-align:center;
font-size:20px;
}
</style>

<body>
    
<h2>Starastha Login</h2>
<input type="text" id="username" placeholder="Enter Username"><br><br>

<input type="password" id="password" placeholder="Enter Password"><br><br>

<button onclick="signup()">Sign Up</button>

<script>
function signup() {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    localStorage.setItem("username", username);
    localStorage.setItem("password", password);

    alert("Account Created Successfully!");

    window.location.href = "login.html";
}
</script>

</body>
</html>
<hr></hr>
<hr></hr>

</script>

</body>
</html>
